<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find It Local — search shops &amp; services near you</title>
<meta name="description" content="Search local shops and services by town and category — barbers, halal food, pharmacies and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root{
    --green:#1B3B32;
    --green-dark:#122822;
    --paper:#F6F1E4;
    --paper-2:#EFE8D6;
    --gold:#C9A24B;
    --gold-light:#E4C77E;
    --ink:#20241F;
    --brick:#A8452F;
    --line:#D8CFB4;
    --radius:8px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    line-height:1.55;
  }
  h1,h2,h3{font-family:'Fraunces', serif; letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono', monospace;}
  a{color:inherit;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}

  .wrap{max-width:920px; margin:0 auto; padding:0 24px;}

  /* ---------- HEADER / SIGNBOARD ---------- */
  header.sign{
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.04), transparent 60%),
      var(--green);
    color:var(--paper);
    border-bottom:6px solid var(--gold);
    position:relative;
    overflow:hidden;
  }
  header.sign::after{
    content:'';
    position:absolute; inset:10px;
    border:1.5px solid rgba(228,199,126,0.35);
    pointer-events:none;
  }
  .sign-inner{padding:52px 24px 60px; text-align:center; position:relative;}
  .sign-eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:11.5px;
    color:var(--gold-light); text-transform:uppercase; letter-spacing:0.22em;
    margin-bottom:14px;
  }
  header.sign h1{
    font-size:clamp(2.1rem, 6vw, 3.2rem);
    font-weight:700;
    color:var(--paper);
    text-shadow:0 2px 0 rgba(0,0,0,0.15);
  }
  header.sign h1 em{
    font-style:italic; color:var(--gold-light); font-weight:500;
  }
  .sign-sub{
    margin-top:12px; color:rgba(246,241,228,0.72); font-size:1rem;
    max-width:480px; margin-left:auto; margin-right:auto;
  }

  /* ---------- SEARCH PLAQUE ---------- */
  .plaque{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 18px 40px -20px rgba(18,40,34,0.35);
    padding:26px;
    margin-top:-46px;
    position:relative;
    z-index:5;
  }
  .field-row{display:grid; grid-template-columns:1fr 1fr auto; gap:14px;}
  @media (max-width:640px){ .field-row{grid-template-columns:1fr;} }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--green);
    text-transform:uppercase; letter-spacing:0.1em;
  }
  .field input{
    font-family:'Work Sans', sans-serif; font-size:16px;
    padding:13px 14px; border:1.5px solid var(--line); border-radius:6px;
    background:#fff; color:var(--ink); outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus{border-color:var(--green);}
  .search-btn{
    background:var(--brick); color:var(--paper); border:none; border-radius:6px;
    padding:0 26px; font-weight:600; font-size:15px; letter-spacing:0.01em;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease, background .12s ease;
  }
  .search-btn:hover{background:#8f3a27; transform:translateY(-1px);}
  .search-btn:active{transform:translateY(0);}
  @media (max-width:640px){ .search-btn{padding:14px; width:100%;} }

  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;}
  .chip{
    font-family:'JetBrains Mono', monospace; font-size:12px;
    border:1px solid var(--line); background:var(--paper-2); color:var(--green);
    padding:7px 13px; border-radius:20px; transition:all .12s ease;
  }
  .chip:hover{border-color:var(--gold); background:#fff;}

  /* ---------- RESULTS ---------- */
  main{padding:48px 0 80px;}
  .status{
    font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--green);
    margin-bottom:22px; min-height:20px;
  }
  .status.error{color:var(--brick);}

  #map{
    height:320px; border-radius:var(--radius); border:1px solid var(--line);
    margin-bottom:28px; display:none; background:var(--paper-2);
  }

  .results-list{display:flex; flex-direction:column; gap:12px;}
  .result-card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; display:flex; justify-content:space-between; gap:16px;
    align-items:flex-start; flex-wrap:wrap;
  }
  .result-main h3{font-size:16px; font-weight:600; margin-bottom:4px;}
  .result-main .addr{font-size:13.5px; color:#5a6058; max-width:520px;}
  .result-main .type-tag{
    display:inline-block; margin-top:8px; font-family:'JetBrains Mono', monospace;
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--green); background:var(--paper-2); border:1px solid var(--line);
    padding:3px 9px; border-radius:12px;
  }
  .result-links{display:flex; flex-direction:column; gap:6px; align-items:flex-end;}
  .result-links a{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--brick);
    white-space:nowrap;
  }
  .result-links a:hover{text-decoration:underline;}

  .empty-state{
    text-align:center; padding:60px 20px; color:#6b7268;
  }
  .empty-state h3{color:var(--green); margin-bottom:8px; font-size:1.3rem;}
  .empty-state p{font-size:14px; max-width:380px; margin:0 auto;}

  footer{
    border-top:1px solid var(--line); padding:28px 0; text-align:center;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; color:#8a8f83;
  }
</style>
</head>
<body>

<header class="sign">
  <div class="sign-inner">
    <div class="sign-eyebrow">est. on your high street</div>
    <h1>Find It <em>Local</em></h1>
    <p class="sign-sub">Two fields. One search. Type a town and what you're after — "Falkirk" and "barber shop", or "halal food" — and see what's nearby.</p>
  </div>
</header>

<div class="wrap">
  <form class="plaque" id="search-form">
    <div class="field-row">
      <div class="field">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="e.g. Falkirk" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <input type="text" id="category" name="category" placeholder="e.g. barber shop" autocomplete="off" required>
      </div>
      <button type="submit" class="search-btn" id="search-btn">Search →</button>
    </div>
    <div class="chip-row">
      <button type="button" class="chip" data-cat="barber shop">Barber shop</button>
      <button type="button" class="chip" data-cat="halal food">Halal food</button>
      <button type="button" class="chip" data-cat="pharmacy">Pharmacy</button>
      <button type="button" class="chip" data-cat="coffee shop">Coffee shop</button>
      <button type="button" class="chip" data-cat="takeaway">Takeaway</button>
      <button type="button" class="chip" data-cat="hairdresser">Hairdresser</button>
    </div>
  </form>

  <main>
    <div class="status" id="status"></div>
    <div id="map"></div>
    <div class="results-list" id="results"></div>
  </main>
</div>

<footer>Powered by OpenStreetMap &amp; Nominatim · free, no API key required</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function(){
  const form = document.getElementById('search-form');
  const locationInput = document.getElementById('location');
  const categoryInput = document.getElementById('category');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const mapEl = document.getElementById('map');
  const searchBtn = document.getElementById('search-btn');

  let map = null;
  let markers = [];

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      categoryInput.value = chip.dataset.cat;
      categoryInput.focus();
    });
  });

  function clearMap(){
    if (map){ markers.forEach(m => map.removeLayer(m)); markers = []; }
  }

  function ensureMap(){
    if (!map){
      map = L.map('map');
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
    }
    mapEl.style.display = 'block';
    setTimeout(() => map.invalidateSize(), 50);
  }

  function renderResults(items, category){
    resultsEl.innerHTML = '';

    if (!items.length){
      resultsEl.innerHTML = `
        <div class="empty-state">
          <h3>Nothing turned up</h3>
          <p>Try a broader term (e.g. "food" instead of "halal food") or double-check the town spelling.</p>
        </div>`;
      return;
    }

    ensureMap();
    clearMap();
    const bounds = [];

    items.forEach(item => {
      const lat = parseFloat(item.lat);
      const lon = parseFloat(item.lon);
      bounds.push([lat, lon]);

      const marker = L.marker([lat, lon]).addTo(map);
      marker.bindPopup(`<strong>${escapeHtml(item.display_name.split(',')[0])}</strong>`);
      markers.push(marker);

      const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
      const osmUrl = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=18/${lat}/${lon}`;

      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="result-main">
          <h3>${escapeHtml(item.display_name.split(',')[0])}</h3>
          <div class="addr">${escapeHtml(item.display_name.split(',').slice(1).join(',').trim())}</div>
          <span class="type-tag">${escapeHtml(category)}</span>
        </div>
        <div class="result-links">
          <a href="${gmapsUrl}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
          <a href="${osmUrl}" target="_blank" rel="noopener">Open in OpenStreetMap ↗</a>
        </div>
      `;
      resultsEl.appendChild(card);
    });

    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function search(location, category){
    statusEl.className = 'status';
    statusEl.textContent = `Searching for "${category}" in ${location}…`;
    resultsEl.innerHTML = '';
    searchBtn.disabled = true;

    const query = `${category} in ${location}`;
    const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(query)}&addressdetails=1&limit=15`;

    try{
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error('Network response was not OK');
      const data = await res.json();

      statusEl.textContent = data.length
        ? `Found ${data.length} result${data.length === 1 ? '' : 's'} for "${category}" in ${location}.`
        : `No matches for "${category}" in ${location}.`;

      renderResults(data, category);
    } catch(err){
      statusEl.className = 'status error';
      statusEl.textContent = 'Something went wrong reaching the search service. Please try again in a moment.';
      resultsEl.innerHTML = '';
    } finally {
      searchBtn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const location = locationInput.value.trim();
    const category = categoryInput.value.trim();
    if (!location || !category) return;
    search(location, category);
  });
})();
</script>
</body>
</html>
